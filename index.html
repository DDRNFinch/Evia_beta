<body><div id="root"></div>
<script>
(function(){
  'use strict';
  var guardTimer=null;

  function openNativeCapture(kind){
    var input=document.getElementById('selfPhoto');
    if(!input)return;
    if(kind==='video'&&window.EviaVideoCapture&&typeof window.EviaVideoCapture.open==='function'){
      window.EviaVideoCapture.open(input);
      return;
    }
    try{input.value='';}catch(e){}
    input.setAttribute('type','file');
    if(kind==='gallery'){
      input.removeAttribute('capture');
      input.setAttribute('accept','image/*');
      input.click();
      return;
    }
    input.setAttribute('capture','environment');
    input.setAttribute('accept',kind==='video'?'video/*':'image/*');
    input.click();
  }

  function makeButton(label,kind){
    var b=document.createElement('button');
    b.type='button';
    b.textContent=label;
    b.setAttribute('data-evia-native-'+kind,'1');
    b.addEventListener('click',function(e){
      e.preventDefault();
      e.stopPropagation();
      if(e.stopImmediatePropagation)e.stopImmediatePropagation();
      openNativeCapture(kind);
    },true);
    return b;
  }

  function makeGalleryButton(){
    var b=document.createElement('button');
    b.type='button';
    b.className='evia-gallery-upload';
    b.setAttribute('data-evia-native-gallery','1');
    b.setAttribute('aria-label','Choose one image from gallery');
    b.setAttribute('title','Choose image from gallery');
    b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2"></rect><circle cx="9" cy="10" r="1.5"></circle><path d="M5.5 17l4.2-4.1 3.2 3 2.3-2.2 3.3 3.3"></path></svg>';
    b.addEventListener('click',function(e){
      e.preventDefault();
      e.stopPropagation();
      if(e.stopImmediatePropagation)e.stopImmediatePropagation();
      openNativeCapture('gallery');
    },true);
    return b;
  }

  function repairCaptureScreen(){
    var card=document.querySelector('.self-card.photo');
    if(!card)return;
    var legacy=card.querySelectorAll('[data-pick]');
    for(var i=0;i<legacy.length;i++)legacy[i].remove();
    var controls=card.querySelector('.evia-native-capture');
    if(!controls){
      controls=document.createElement('div');
      controls.className='evia-native-capture';
      controls.appendChild(makeButton('Take photo','photo'));
      controls.appendChild(makeButton('Record video','video'));
      controls.appendChild(makeGalleryButton());
      var label=card.querySelector('span');
      if(label&&label.nextSibling)card.insertBefore(controls,label.nextSibling);
      else if(label)card.appendChild(controls);
      else card.insertBefore(controls,card.firstChild);
    }else if(!controls.querySelector('[data-evia-native-gallery]')){
      controls.appendChild(makeGalleryButton());
    }
    controls.style.display='grid';
    var buttons=controls.querySelectorAll('button');
    for(var j=0;j<buttons.length;j++){
      buttons[j].style.display='block';
      buttons[j].style.visibility='visible';
      buttons[j].style.opacity='1';
    }
  }

  document.addEventListener('click',function(e){
    var target=e.target;
    while(target&&target!==document){
      if(target.getAttribute&&target.getAttribute('data-pick')!==null){
        e.preventDefault();
        e.stopPropagation();
        if(e.stopImmediatePropagation)e.stopImmediatePropagation();
        target.remove();
        repairCaptureScreen();
        return false;
      }
      target=target.parentNode;
    }
  },true);

  function startGuard(){
    repairCaptureScreen();
    if(guardTimer)clearInterval(guardTimer);
    guardTimer=setInterval(repairCaptureScreen,120);
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',startGuard);
  else startGuard();
  window.addEventListener('pageshow',repairCaptureScreen);
  window.addEventListener('focus',repairCaptureScreen);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')repairCaptureScreen();});
})();
</script>
