name: Bootstrap Evia Beta

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.head_commit.message == 'Bootstrap Evia_beta from Evia v75'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy current Evia into beta
        shell: bash
        run: |
          rm -rf /tmp/evia-source
          git clone --depth 1 --branch main https://github.com/DDRNFinch/Evia.git /tmp/evia-source
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/bootstrap-beta.yml' /tmp/evia-source/ ./
          rm -f .github/workflows/bootstrap-beta.yml

      - name: Commit copied Evia to beta
        shell: bash
        run: |
          git config user.name "Evia Beta Sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Initialize Evia_beta from Evia v75"
          git push origin HEAD:main
